plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.5'
	id 'io.spring.dependency-management' version '1.1.6'
	// Убираем плагин Querydsl для избежания конфликтов
	// id "com.ewerk.gradle.plugins.querydsl" version "1.0.10"
}

group = 'T-Bank'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.session:spring-session-core'

	implementation 'com.googlecode.libphonenumber:libphonenumber:8.12.50'

	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	// Jakarta Inject
	implementation 'jakarta.inject:jakarta.inject-api:2.0.1'

	// Querydsl зависимости
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	implementation 'com.querydsl:querydsl-core:5.0.0'

	// Jakarta Persistence API
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'

	// Jakarta Annotation API
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api:2.1.0'

	runtimeOnly 'org.postgresql:postgresql:42.7.2'
	implementation 'com.pgvector:pgvector:0.1.6'
	implementation 'org.hibernate.orm:hibernate-core:6.4.1.Final'
	implementation 'org.hibernate.orm:hibernate-vector:6.4.1.Final'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	implementation 'org.locationtech.jts:jts-core:1.18.2'

	implementation 'org.flywaydb:flyway-core'


	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
	testImplementation 'org.testng:testng:7.10.1'
  
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.withType(JavaCompile).configureEach {
	options.annotationProcessorPath = configurations.annotationProcessor
	options.compilerArgs += ['-s', layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile.absolutePath]
}

sourceSets {
	main {
		java {
			srcDirs = ["src/main/java", layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile.absolutePath]
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
